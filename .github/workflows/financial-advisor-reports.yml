name: Financial Advisor Reports

concurrency:
  group: advisor-evidence-writer
  cancel-in-progress: false

on:
  schedule:
    # BRT is UTC-3: 11:15 BRT on weekdays.
    - cron: "15 14 * * 1-5"
    # BRT is UTC-3: 17:15 BRT on weekdays.
    - cron: "15 20 * * 1-5"
  workflow_dispatch:
    inputs:
      report_type:
        description: "Report type to generate"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - close

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
      ADVISOR_ACCOUNT_CAPITAL: ${{ secrets.ADVISOR_ACCOUNT_CAPITAL }}
      ADVISOR_RISK_FRACTION: ${{ secrets.ADVISOR_RISK_FRACTION }}
      ADVISOR_MAX_DAILY_LOSS_FRACTION: ${{ secrets.ADVISOR_MAX_DAILY_LOSS_FRACTION }}
      ADVISOR_MAX_WEEKLY_LOSS_FRACTION: ${{ secrets.ADVISOR_MAX_WEEKLY_LOSS_FRACTION }}
      ADVISOR_STOCK_WATCHLIST: INTC,AMD,NVDA,HIMS,MU,MSFT,USAR,CRDO,DELL,MRVL,HOOD
      ADVISOR_CRYPTO_WATCHLIST: SOL,HYPE,BTC,ETH
      ADVISOR_MAX_STOCKS_PER_RUN: 11
      ADVISOR_FMP_CALL_BUDGET_PER_RUN: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore market cache
        id: market-cache
        uses: actions/cache/restore@v4
        with:
          path: data/advisor.db
          key: financial-advisor-market-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            financial-advisor-market-cache-${{ runner.os }}-${{ github.ref_name }}-

      - name: Record cache status
        shell: bash
        run: |
          echo "ADVISOR_ACTIONS_CACHE_HIT=${{ steps.market-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"

      - name: Select report type
        shell: bash
        run: |
          REPORT_TYPE="${{ github.event.inputs.report_type }}"
          if [ -z "$REPORT_TYPE" ]; then
            if [ "${{ github.event.schedule }}" = "15 20 * * 1-5" ]; then
              REPORT_TYPE=close
            else
              REPORT_TYPE=main
            fi
          fi
          echo "REPORT_TYPE=$REPORT_TYPE" >> "$GITHUB_ENV"

      - name: Validate live config
        continue-on-error: true
        run: python -m advisor config validate --require-live

      - name: Generate report
        shell: bash
        run: |
          if [ "$REPORT_TYPE" = "main" ]; then
            python -m advisor report main --include-discovery --require-live --runtime-scoring-artifact --output-dir reports
          else
            python -m advisor report close --from-main --require-live --runtime-scoring-artifact --output-dir reports
          fi

      - name: Record observation sidecar transport
        id: observation-sidecar
        shell: bash
        run: |
          if [ -f reports/evidence/observations.json.gz ]; then
            echo "sidecar_path=reports/evidence/observations.json.gz" >> "$GITHUB_OUTPUT"
          else
            echo "sidecar_path=unavailable" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-advisor-${{ env.REPORT_TYPE }}-${{ github.run_id }}
          # The unfiltered reports/ artifact carries reports/evidence/observations.json.gz.
          path: reports/
          if-no-files-found: error

      - name: Save market cache
        if: always() && hashFiles('data/advisor.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/advisor.db
          key: financial-advisor-market-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

  archive-observation:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download report transport
        uses: actions/download-artifact@v4
        with:
          path: .tmp/report-artifacts

      - name: Package observation sidecar
        shell: bash
        run: |
          sidecar="$(find .tmp/report-artifacts -type f -path '*/evidence/observations.json.gz' -print -quit)"
          if [ -z "$sidecar" ]; then
            echo "observation_sidecar_unavailable"
            false
          fi
          mkdir -p .tmp/observation-transport
          cp "$sidecar" .tmp/observation-transport/observations.json.gz
          python -m advisor evidence package --transport-dir .tmp/observation-transport --output-dir .tmp/observation-canonical-transport

      - name: Archive packaged observation sidecar
        shell: bash
        run: |
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"
          if [ -z "$auth_header" ]; then
            echo "github_checkout_auth_header_unavailable"
            exit 1
          fi
          git config --local --unset-all http.https://github.com/.extraheader
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="$auth_header"
          python -m advisor evidence archive --transport-dir .tmp/observation-canonical-transport --repo-dir .
